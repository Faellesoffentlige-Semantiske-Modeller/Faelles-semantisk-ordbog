{% from "_back.html" import back_link %}
<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictionary items</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dkfds/css/dkfds.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    {{ back_link(url_for('main.index')) }}
    <h1>Dictionary items</h1>

    {% if error %}
      <div class="alert alert-error" role="alert">
        <div class="alert-body"><p class="alert-text">{{ error }}</p></div>
      </div>
    {% else %}
      <p>{{ count }} item(s).</p>
      <table class="items-table">
        <thead>
          <tr><th scope="col">Navn</th><th scope="col">Element</th></tr>
        </thead>
        <tbody>
          {% for card in cards %}
            <tr class="clickable-row">
              <td class="item-label">
                <a href="{{ url_for('items.detail', item_uuid=card.uuid) }}">{{ card.label }}</a>
              </td>
              <td>{{ card.element }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% endif %}
  </main>

  <script src="{{ url_for('static', filename='dkfds/js/dkfds.js') }}"></script>
</body>
</html>
